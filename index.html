<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./style.css">
</head>
<body>
    
<div class="main-container">

<div class="container text-primary">
    <h1>Weather App</h1>
</div>

<div class="weather-container">
    <h4>Cloudy</h4>
</div>

<input type="text" name="" placeholder="Search City..." id="search-bar" class="text-center"  required>
<br>
<button onclick="getWeatherData()" id="searchbutton" class="btn bg-primary">Search</button>
<div class="result">
    <h1 id="weather-type">-------</h1>
    <div>
        <h3 id="city-name">----------</h3>
        <h3>Temperature: <span id="Temperature"></span> <span>--°F</span></h3>
        <h3>Min-Temp<span id="Min-Temp"></span> <span>--°F</span> </h3>
        <h3>Max-Temp: <span id="Max-Temp"></span> <span>--°F</span></h3>
    </div>
</div>

</div>






    
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
        <script src="./script.js"></script>
</body>
</html>
